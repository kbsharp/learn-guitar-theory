name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    # ── Fast checks — run on every push/PR ────────────────────────────────────
    check:
        name: Type-check, lint & unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            - name: Svelte type-check
              run: npm run check

            - name: Lint
              run: npm run lint

            - name: Unit tests
              run: npm run test:unit -- --run

    # ── E2E — runs on every push/PR to master (catches regressions pre-merge) ─
    e2e:
        name: Playwright e2e (chromium)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install chromium --with-deps

            - name: Build
              run: npm run build

            - name: E2E tests
              run: npm run test
              env:
                  CI: true

            - name: Upload Playwright traces on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-traces
                  path: test-results/
                  retention-days: 7
