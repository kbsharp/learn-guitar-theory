name: CI

# PRs only — deliberately not `push: [master]`.
#
# A `pull_request` event does not test the branch head. GitHub builds
# `refs/pull/N/merge`, the result of merging the PR into master, and runs
# against that. So the tree CI proves green is the tree that lands. Re-running
# the identical commits after the merge tested nothing new, and cost a full
# duplicate run on every single merge.
#
# Nothing depended on that second run: there's no CI badge, and the Vercel
# deploy comes from Vercel's own GitHub integration, which fires on push
# independently of Actions and never waited on this workflow.
#
# The one gap this leaves is merge skew — if master moves after a PR is tested
# and the PR isn't retested, its green tick describes a merge result that no
# longer applies. Close it with branch protection on master: "Require status
# checks to pass" plus "Require branches to be up to date before merging",
# which forces a retest whenever the base moves. See CI / CD in CLAUDE.md.
on:
    pull_request:
        branches: [master]
    # Escape hatch: run against master by hand from the Actions tab if a merge
    # ever lands without a PR, or to re-verify after changing repo settings.
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Pushing twice to a PR used to leave the first run grinding away on a commit
# nobody will merge. Supersede it instead — the only run worth having is the
# one for the current head.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ── Fast checks — the gate. Never merge with this red ─────────────────────
    check:
        name: Type-check, lint & unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci --no-audit --fund=false

            - name: Svelte type-check
              run: npm run check

            - name: Lint
              run: npm run lint

            - name: Unit tests
              run: npm run test:unit

    # ── E2E — the safety net. Catches regressions pre-merge ───────────────────
    e2e:
        name: Playwright e2e (chromium)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci --no-audit --fund=false

            # The browser binary is ~130MB and identical between runs until the
            # Playwright version moves, so key the cache on the lockfile.
            - name: Cache Playwright browser
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright browser
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install chromium --with-deps

            # Cached binary still needs the system libs it links against; this
            # is a no-op apt run when the runner image already has them.
            - name: Install Playwright system dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium

            # Built once, here. playwright.config.ts deliberately skips its own
            # build under CI so the app isn't compiled twice per run.
            - name: Build
              run: npm run build

            - name: E2E tests
              run: npm run test
              env:
                  CI: true

            - name: Upload Playwright traces on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-traces
                  path: test-results/
                  retention-days: 7
